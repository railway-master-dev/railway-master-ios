name: Fix inventory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate inventory from actual tree
        run: |
          rm -f .github/workflows/fix-inventory.yml
          python3 Scripts/generate_package_inventory.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate package inventory"
          git push
