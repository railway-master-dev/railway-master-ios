name: iOS CI Build Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash Scripts/ci_run.sh static
  build-and-test:
    needs: static-checks
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: bash Scripts/ci_run.sh build
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-test-logs
          path: |
            build.log
            test.log
            TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14
  package-tests:
    needs: static-checks
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: bash Scripts/ci_run.sh packages
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-logs
          path: package-test-*.log
          if-no-files-found: ignore
          retention-days: 14
